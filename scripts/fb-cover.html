<!doctype html>
<!-- Facebook page cover, 1640×624. Text stays in the central ~1000px (mobile crops the sides).
     Render: Chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1640,624 --screenshot=fb-cover.png file://…/fb-cover.html -->
<html lang="bg"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap&subset=cyrillic" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1640px;height:624px;overflow:hidden}
body{font-family:Inter,sans-serif;color:#fff;position:relative;
 background:
  radial-gradient(640px 380px at 1240px 30px,#2c2a72 0%,transparent 70%),
  radial-gradient(560px 340px at 260px 640px,#16295e 0%,transparent 70%),
  radial-gradient(500px 260px at 820px 330px,#1a1d4a 0%,transparent 75%),
  #0d1022}
svg.deco{position:absolute;inset:0}
.center{position:absolute;left:0;right:0;top:150px;display:flex;flex-direction:column;align-items:center}
.top{display:flex;align-items:center;gap:32px}
.logo{width:120px;height:120px;border-radius:27px;background:linear-gradient(135deg,#3b82f6,#4f46e5);display:flex;align-items:center;justify-content:center;box-shadow:0 0 70px rgba(79,70,229,.55)}
.name{font-size:110px;font-weight:800;letter-spacing:-3px;line-height:1}
.tag{font-size:32px;font-weight:600;color:#a5b4fc;margin-top:6px}
.sub{margin-top:44px;font-size:34px;font-weight:600;text-align:center;line-height:1.35;color:#e0e7ff}
.url{margin-top:26px;font-size:26px;font-weight:700;letter-spacing:.5px;color:#fff;opacity:.9}
</style></head><body>

</svg>

<div class="center">

</body></html>
